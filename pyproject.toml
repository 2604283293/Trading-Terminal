[project]
name = "trading-terminal"
version = "0.1.0"
description = "Trading Terminal — A 股盘后分析桌面终端（多模块 monorepo）"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "desktop-shell",
    "graphical-trading",
    "sector-trading",
    "news",
]

[tool.ruff]
line-length = 100
target-version = "py311"
