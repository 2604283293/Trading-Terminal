[project]
name = "tt-shared"
version = "0.1.0"
description = "Trading Terminal 共享数据服务 — FastAPI 聚合 TDX/Tushare/AkShare/韭研公社等数据源"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "httpx",
    "selectolax",
    "apscheduler",
    "selenium>=4.6",
    "beautifulsoup4",
    "lxml",
    "pyarrow",
    "pywin32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
