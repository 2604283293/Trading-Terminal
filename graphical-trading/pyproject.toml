[project]
name = "tt-graphical-trading"
version = "0.1.0"
description = "图形交易模块 — K 线、指标、画线"
requires-python = ">=3.11"
dependencies = [
    "pyside6",
    "pyqtgraph",
    "pandas",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphical_trading"]
