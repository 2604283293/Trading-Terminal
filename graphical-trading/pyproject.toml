[project]
name = "tt-graphical-trading"
version = "0.1.0"
description = "选股筛选器 — 自定义条件扫描全 A 股日线数据"
requires-python = ">=3.11"
dependencies = [
    "pyside6",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphical_trading"]
