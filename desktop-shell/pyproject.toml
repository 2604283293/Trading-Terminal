[project]
name = "tt-desktop-shell"
version = "0.1.0"
description = "Trading Terminal 桌面主程序 — PySide6 壳子，承载三个业务模块"
requires-python = ">=3.11"
dependencies = [
    "pyside6",
    "tt-graphical-trading",
    "tt-sector-trading",
    "tt-news",
]

[project.scripts]
trading-terminal = "desktop_shell.__main__:main"

[tool.uv.sources]
tt-graphical-trading = { workspace = true }
tt-sector-trading = { workspace = true }
tt-news = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_shell"]
